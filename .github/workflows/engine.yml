name: engine

on:
  pull_request:
    paths: ["engine/**", "bindings/**", "tools/check_engine_bans.py", "tools/packer/**", ".github/workflows/engine.yml"]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes its older runs (macOS runners are scarce); main never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # main is always fully verified

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, cxx: clang++-18 }
          - { name: macos-arm64, os: macos-14, cxx: clang++ }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Debug build + tests
        working-directory: engine
        env: { CXX: "${{ matrix.cxx }}" }
        run: |
          cmake --preset native-debug
          cmake --build --preset native-debug
          ctest --preset native-debug
      - name: Release build + tests (digests must equal debug)
        working-directory: engine
        env: { CXX: "${{ matrix.cxx }}" }
        run: |
          cmake --preset native-release
          cmake --build --preset native-release
          ctest --preset native-release

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 6.0.13 }  # same version verified locally
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: WASM build + tests under node
        working-directory: engine
        run: |
          cmake --preset wasm-release
          cmake --build --preset wasm-release
          ctest --preset wasm-release

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build the C ABI shared library
        working-directory: engine
        env: { CXX: clang++-18 }
        run: |
          cmake --preset native-release -DTRADELAB_BUILD_TESTS=OFF
          cmake --build --preset native-release --target tradelab_capi
      - name: Python binding tests (cross-binding goldens)
        working-directory: bindings/python
        run: uv run --python 3.12 --with pytest pytest -q

  # libFuzzer with ASan + UBSan on the untrusted-input parsers (CSV import, packs, JSON).
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18
      - name: Build fuzz targets
        working-directory: engine
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTRADELAB_BUILD_TESTS=OFF \
            -DTRADELAB_BUILD_FUZZERS=ON -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build build/fuzz --target fuzz_csv fuzz_pack fuzz_json
      - name: Fuzz 60 s each (seed corpora in engine/fuzz/corpus)
        working-directory: engine
        run: |
          for t in csv pack json; do
            mkdir -p "$RUNNER_TEMP/corpus-$t" && cp fuzz/corpus/$t/* "$RUNNER_TEMP/corpus-$t/"
            build/fuzz/fuzz_$t -max_total_time=60 -max_len=20000 -timeout=10 "$RUNNER_TEMP/corpus-$t"
          done

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy-18
      - name: Banned APIs
        run: python3 tools/check_engine_bans.py engine/src engine/include
      - name: Generated IDL files are current (engine/idl/gen.py)
        run: python3 engine/idl/gen.py --check
      - name: clang-tidy (incl. cognitive complexity <= 15)
        working-directory: engine
        env: { CXX: clang++-18 }
        run: |
          cmake --preset native-debug
          clang-tidy-18 -p build/native-debug --quiet src/*.cpp

  openspec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @fission-ai/openspec@1.13.2
      - run: openspec validate --all --strict
