name: api

on:
  pull_request:
    paths: ["services/api/**", "bindings/**", "engine/**", ".github/workflows/api.yml"]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # main is always fully verified

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: tradelab }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build the engine C ABI library
        working-directory: engine
        env: { CXX: clang++-18 }
        run: |
          cmake --preset native-release -DTRADELAB_BUILD_TESTS=OFF
          cmake --build --preset native-release --target tradelab_capi
      - name: Tests (SQLite)
        working-directory: services/api
        run: uv run --python 3.12 pytest -q
      - name: Tests (PostgreSQL)
        working-directory: services/api
        env:
          TRADELAB_TEST_DATABASE_URL: postgresql+psycopg://postgres:pw@localhost:5432/tradelab
        run: uv run --python 3.12 pytest -q
      - name: Docker image builds
        run: docker build -f services/api/Dockerfile -t tradelab-api:ci .
