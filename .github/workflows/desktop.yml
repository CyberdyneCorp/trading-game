name: desktop

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "engine/**"
      - "apps/web/src/lib/game/i18n.svelte.ts"
      - "apps/web/src/lib/game/missions.ts"
      - "apps/web/src/lib/game/packs.ts"
      - "apps/web/src/lib/game/*.ts"
      - "apps/web/static/icons/**"
      - "openspec/changes/add-native-clients/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]

permissions:
  contents: read

# The engine builds with -Wpedantic -Werror and uses __int128, which GCC rejects under -pedantic:
# Linux uses Clang, as engine.yml does.
env:
  CC: clang
  CXX: clang++

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: linux (ubuntu 24.04, X11 + lavapipe, AppImage)
    runs-on: ubuntu-24.04
    # --init: xvfb-run must not be PID 1 (it would wait forever for its Xvfb).
    container:
      image: ubuntu:24.04
      options: --init
    steps:
      - name: Install packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake ninja-build git python3 \
            libx11-dev zlib1g-dev libvulkan1 mesa-vulkan-drivers xvfb xauth clang clang-tidy libcurl4 \
            curl ca-certificates file desktop-file-utils weston libwayland-client0 libxkbcommon0
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Raven pin agrees with the docs
        run: python3 apps/desktop/scripts/check_raven_pin.py
      - name: i18n catalogs in sync with apps/web
        run: |
          (cd apps/web && npm ci --ignore-scripts)
          node apps/desktop/scripts/check_i18n.mjs
          node --test apps/desktop/tests/scripts/check_i18n.test.mjs apps/desktop/tests/scripts/i18n_game.test.mjs \
            apps/desktop/tests/scripts/screen_sources.test.mjs
      - name: Web parity fixtures in sync with the web helpers
        run: node apps/desktop/scripts/gen_web_fixtures.mjs --check
      - name: Build
        working-directory: apps/desktop
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release -j 4
      - name: Unit, golden, headless, CMake-rule and script tests
        working-directory: apps/desktop
        run: ctest --preset linux-release
      - name: Windowed tests (Xvfb + Mesa lavapipe)
        working-directory: apps/desktop
        run: |
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build/linux-release -L windowed --output-on-failure
      - name: Wayland smoke test (headless Weston + Mesa lavapipe)
        working-directory: apps/desktop
        run: |
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          packaging/smoke_wayland.sh build/linux-release/tradelab
      - name: AppImage (pinned appimagetool) and its smoke test
        working-directory: apps/desktop
        run: |
          packaging/package_appimage.sh build/linux-release dist
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          xvfb-run -a -s "-screen 0 1920x1080x24" packaging/smoke_appimage.sh dist/TradeLab-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: TradeLab-linux-x86_64-AppImage
          path: apps/desktop/dist/TradeLab-x86_64.AppImage
      - name: No Vulkan driver, then no Vulkan loader (exit 3 with the message)
        working-directory: apps/desktop
        run: |
          ctest --test-dir build/linux-release -L novulkan --output-on-failure
          apt-get remove -y libvulkan1 mesa-vulkan-drivers
          ctest --test-dir build/linux-release -L novulkan --output-on-failure
      - name: Cognitive complexity <= 15
        working-directory: apps/desktop
        run: scripts/check_complexity.sh build/linux-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-captures-linux
          path: apps/desktop/build/linux-release/captures
          if-no-files-found: ignore

  linux-headless:
    name: linux-headless (Raven null platform, no Vulkan)
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Install packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake ninja-build git python3 clang
      - uses: actions/checkout@v4
      - name: Build + tests
        working-directory: apps/desktop
        run: |
          cmake --preset linux-headless
          cmake --build --preset linux-headless -j 4
          ctest --preset linux-headless

  # ThreadSanitizer over the EngineHost worker (task 1.10): the command queue, the coalesced hand-off to the
  # UI thread and the storage writes on the worker. On the runner itself, not in a container: TSan needs
  # the kernel's mmap randomness lowered, which a container cannot do.
  tsan:
    name: tsan (EngineHost worker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang cmake
          sudo sysctl vm.mmap_rnd_bits=28
      - name: Build the unit tests with -fsanitize=thread
        working-directory: apps/desktop
        run: |
          cmake --preset linux-headless -B build/tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS=-fsanitize=thread -DCMAKE_CXX_FLAGS=-fsanitize=thread \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
          cmake --build build/tsan -j 4 --target tradelab_desktop_unit_tests
      - name: EngineHost, storage host and pack service tests under TSan
        working-directory: apps/desktop
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
        run: build/tsan/tests/tradelab_desktop_unit_tests -tc="engine host*,storage host*,pack service*"

  macos:
    name: "macos (universal: arm64 + x86_64 under Rosetta, .app)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Homebrew's MoltenVK serves the windowed tests of the build folder; the .app bundles its own pinned
      # copy (packaging/pins.sh) and its smoke test checks that copy is the one used.
      - name: Install Ninja and MoltenVK
        run: brew install ninja molten-vk
      - name: Build (universal)
        working-directory: apps/desktop
        run: |
          cmake --preset macos-universal
          cmake --build --preset macos-universal -j 4
      - name: Unit, golden, headless, CMake-rule and script tests (arm64)
        working-directory: apps/desktop
        run: ctest --preset macos-universal
      # The universal app ships only when the x86_64 slice reaches the same golden digests.
      - name: Goldens on the x86_64 slice (Rosetta)
        working-directory: apps/desktop
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 build/macos-universal/tests/tradelab_desktop_golden_tests
      # Windowed tests on the hosted runner's Metal device through MoltenVK: they pass there, so they block.
      # The runner's display is 1024x768, so macOS shrinks every window to 1024x645: the checks that need
      # the requested window size (reference images, text cut by its panel) are reported and skipped here
      # (TRADELAB_SMALL_SCREEN=1, tests/support/window_size.hpp) and asserted by the Linux job (Xvfb 1920x1080).
      - name: Windowed tests (MoltenVK)
        working-directory: apps/desktop
        env:
          TRADELAB_SMALL_SCREEN: "1"
        run: |
          system_profiler SPDisplaysDataType || true
          ctest --test-dir build/macos-universal -L windowed --output-on-failure
      - name: TradeLab.app (pinned MoltenVK, ad-hoc signed)
        working-directory: apps/desktop
        run: packaging/package_macos.sh build/macos-universal dist
      - name: Launch from Finder (LaunchServices) smoke test (best effort, needs Metal)
        working-directory: apps/desktop
        continue-on-error: true
        run: packaging/smoke_macos.sh dist/TradeLab.app
      - uses: actions/upload-artifact@v4
        with:
          name: TradeLab-macos-universal-unsigned
          path: apps/desktop/dist/TradeLab-macos.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-captures-macos
          path: apps/desktop/build/macos-universal/captures
          if-no-files-found: ignore
